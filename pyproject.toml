[project]
name = "qwen-with-translation-test"
version = "0.1.0"
description = "Korean-English-Korean chat pipeline for comparing Qwen responses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.66.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
qwen-translate-chat = "qwen_translation_test.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_translation_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
